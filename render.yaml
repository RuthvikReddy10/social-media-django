services:
  - type: web
    name: social-media-django
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn socialmedia.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false
